<div class="mb-6 p-8 flex justify-between items-center animate-fade-in">
    <div>
        <h1 class="text-2xl font-bold text-slate-800">歡迎回來，{{store.adminInfo().name}}</h1>
        <p class="text-xs text-slate-400 mt-1">這是您今日的系統營運摘要與最新動態。</p>
    </div>
    <p-button label="安全營運診斷" icon="pi pi-shield" severity="secondary" size="small" [outlined]="true" />
</div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 px-8">

    <p-card header="會員總數">
        <div class="flex justify-between items-start">
            <div>
                <span class="text-xs font-semibold text-slate-400 block mb-1">全體會員總數</span>
                <span class="text-4xl font-extrabold text-slate-700">{{ store.items().length }}</span>
            </div>
            <div class="p-3 bg-blue-50 rounded-lg text-blue-500">
                <i class="pi pi-users text-xl"></i>
            </div>
        </div>
        <div class="text-[11px] text-green-500 mt-3 flex items-center gap-1 font-medium">
            <i class="pi pi-arrow-up-right"></i> 
            <span>+ 14% 較上月新增</span>
        </div>
    </p-card>
    <p-card></p-card>
    <p-card></p-card>
    <p-card></p-card>
    <div class="mt-6">
        <p-card header="系統管理快速通道" subheader="點擊即可快速跳轉至核心子系統" class="shadow-sm">
            <div class="flex flex-wrap gap-4 mt-2">
                <p-button label="建立全新會員" icon="pi pi-user-plus" severity="success" size="small"
                    (click)="navigateTo('members/create')" />
                <p-button label="前往帳號資訊設定" icon="pi pi-cog" severity="secondary" size="small" [outlined]="true"
                    (click)="navigateTo('/profile')" />
            </div>
        </p-card>
    </div>
</div>
