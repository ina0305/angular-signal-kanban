<p-toolbar class="!bg-zinc-700 !rounded-none !text-white">
    <ng-template #start>
        <div class="text-xl pl-4">Angular Signal Kanban</div>
    </ng-template>
    <ng-template #center></ng-template>
    <ng-template #end>
        <p-avatar image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png" size="large"
            shape="circle" />
    </ng-template>
</p-toolbar>
<p-sidebar-layout class="!bg-slate-50">
    <p-sidebar>
        <p-sidebar-spacer />
        <p-sidebar-aside>
            <p-sidebar-panel>
                <p-sidebar-header></p-sidebar-header>
                <p-sidebar-content class="border-r border-zinc-200">
                    <p-sidebar-group>
                        <p-sidebar-group-content>
                            <p-sidebar-menu>

                                <p-sidebar-menu-item>
                                    <button pSidebarMenuButton [class.active-button]="router.url==='/'"
                                        (click)="navigateTo('/')">
                                        <svg data-p-icon="home" [size]="30"></svg>
                                        <span>Home</span>
                                    </button>
                                </p-sidebar-menu-item>

                                <p-sidebar-menu-item>
                                    <button pSidebarMenuButton [class.active-button]="router.url === '/add-member'"
                                        (click)="navigateTo('/add-member')">
                                        <svg data-p-icon="plus" [size]="30"></svg>
                                        <span>Add Member</span>
                                    </button>
                                </p-sidebar-menu-item>

                                <p-sidebar-menu-item>
                                    <button pSidebarMenuButton [class.active-button]="router.url === '/member-list'"
                                        (click)="navigateTo('/member-list')">
                                        <svg data-p-icon="users" [size]="30"></svg>
                                        <span class="ml-2 text-lg">Member List</span>
                                    </button>
                                </p-sidebar-menu-item>

                                <p-sidebar-menu-item>
                                    <button pSidebarMenuButton [class.active-button]="router.url === '/create'"
                                        (click)="navigateTo('/create')">
                                        <svg data-p-icon="plus" [size]="30"></svg>
                                        <span>Create Member</span>
                                    </button>
                                </p-sidebar-menu-item>

                                <p-sidebar-menu-item>
                                    <button pSidebarMenuButton [class.active-button]="router.url === '/profile'"
                                        (click)="navigateTo('/profile')">
                                        <svg data-p-icon="user" [size]="30"></svg>
                                        <span>Profile</span>
                                    </button>
                                </p-sidebar-menu-item>

                            </p-sidebar-menu>
                        </p-sidebar-group-content>
                    </p-sidebar-group>
                </p-sidebar-content>
                <p-sidebar-footer>...</p-sidebar-footer>
            </p-sidebar-panel>
        </p-sidebar-aside>
    </p-sidebar>
    <p-sidebar-main>
        <div class="flex">
            @if(router.url !== '/'){
            <p-breadcrumb [model]="memberStore.breadcrumbs()" [home]="home" />
            }

        </div>
        <router-outlet />
    </p-sidebar-main>

</p-sidebar-layout>
